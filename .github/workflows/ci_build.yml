name: Build and test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libasound2-dev pkg-config clang libclang-dev mesa-vulkan-drivers libfontconfig1-dev libssl-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Verify documentation inventory
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/index.md
            docs/architecture.md
            docs/data-model.md
            docs/keyboard-shortcuts.md
            docs/effects.md
            docs/roadmap.md
            docs/plugin-api-spec.md
            docs/timeline-behavior.md
            docs/implementation-status.md
          )
          for file in "${required[@]}"; do
            test -s "$file"
          done
          cargo metadata --format-version 1 --no-deps >/dev/null
      - name: Lint
        run: cargo xtask lint
      - name: Build and lint the isolated fframes worker (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo fmt --manifest-path tools/fframes-worker/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask cargo clippy --locked --manifest-path tools/fframes-worker/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask cargo build --release --locked --manifest-path tools/fframes-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD/third_party/ffmpeg/bin;$env:PATH"
          & tools/fframes-worker/target/release/OpenPremier-FFrames.exe --self-test --backend cpu
      - name: Build and lint the isolated fframes worker (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/fframes-worker/Cargo.toml --check
          cargo xtask cargo clippy --locked --manifest-path tools/fframes-worker/Cargo.toml --all-targets -- -D warnings
          cargo xtask cargo build --release --locked --manifest-path tools/fframes-worker/Cargo.toml
          export LD_LIBRARY_PATH="$PWD/third_party/ffmpeg/lib:${LD_LIBRARY_PATH:-}"
          tools/fframes-worker/target/release/OpenPremier-FFrames --self-test --backend cpu
      - name: Test
        # effects and exports are tested on a real adapter (software Vulkan on Linux, Metal on
        # macOS) instead of being skipped
        env:
          OPENPREMIER_REQUIRE_GPU: ${{ runner.os != 'Windows' && '1' || '' }}
          OPENPREMIER_FFRAMES_WORKER: ${{ format('{0}/tools/fframes-worker/target/release/OpenPremier-FFrames{1}', github.workspace, runner.os == 'Windows' && '.exe' || '') }}
          OPENPREMIER_REQUIRE_FFRAMES: '1'
        run: cargo xtask test
